<text x="40" y="52" fill="#e6e9ee" font-size="22" font-weight="600" text-anchor="start">dsh-sidekick-lens · 架构</text>
<text x="40" y="76" fill="#9aa3af" font-size="13" font-weight="400" text-anchor="start">纯规则折叠：实时监测零模型调用；只有按「问」才调一次模型</text>
<rect x="40" y="104" width="1100" height="210" rx="10" fill="#171b21" stroke="#2a303a" stroke-width="1"/>
<text x="60" y="132" fill="#e6e9ee" font-size="15" font-weight="600" text-anchor="start">① DeepSeek Harness 宿主</text>
<text x="300" y="132" fill="#6b7480" font-size="12" font-weight="400" text-anchor="start">插件订阅这些事件（{ global: true }，含子会话）</text>
<rect x="60" y="152" width="470" height="34" rx="10" fill="#12161b" stroke="#2a303a" stroke-width="1"/>
<text x="74" y="174" fill="#5b8fd0" font-size="12.5" font-weight="400" text-anchor="start">session/event</text>
<text x="240" y="174" fill="#6b7480" font-size="11.5" font-weight="400" text-anchor="start">turn / step / tool / 用户消息 / todo</text>
<rect x="60" y="192" width="470" height="34" rx="10" fill="#12161b" stroke="#2a303a" stroke-width="1"/>
<text x="74" y="214" fill="#5b8fd0" font-size="12.5" font-weight="400" text-anchor="start">agent/status</text>
<text x="240" y="214" fill="#6b7480" font-size="11.5" font-weight="400" text-anchor="start">running / idle</text>
<rect x="60" y="232" width="470" height="34" rx="10" fill="#12161b" stroke="#2a303a" stroke-width="1"/>
<text x="74" y="254" fill="#5b8fd0" font-size="12.5" font-weight="400" text-anchor="start">agent/error</text>
<text x="240" y="254" fill="#6b7480" font-size="11.5" font-weight="400" text-anchor="start">错误</text>
<rect x="60" y="272" width="470" height="34" rx="10" fill="#12161b" stroke="#2a303a" stroke-width="1"/>
<text x="74" y="294" fill="#5b8fd0" font-size="12.5" font-weight="400" text-anchor="start">agent/assistant-stream</text>
<text x="240" y="294" fill="#6b7480" font-size="11.5" font-weight="400" text-anchor="start">流式 token（正文 + 思维链）</text>
<rect x="560" y="152" width="250" height="140" rx="10" fill="#12161b" stroke="#2a303a" stroke-width="1"/>
<text x="576" y="174" fill="#3f9c94" font-size="12.5" font-weight="400" text-anchor="start">子会话（子 agent）</text>
<text x="576" y="196" fill="#6b7480" font-size="11" font-weight="400" text-anchor="start">自己也是一个完整会话</text>
<text x="576" y="214" fill="#6b7480" font-size="11" font-weight="400" text-anchor="start">父 id 来自</text>
<text x="576" y="231" fill="#c9a26a" font-size="11" font-weight="400" text-anchor="start">session.header</text>
<text x="576" y="248" fill="#c9a26a" font-size="11" font-weight="400" text-anchor="start">  .parentSession</text>
<text x="576" y="274" fill="#9aa3af" font-size="11" font-weight="400" text-anchor="start">→ buildTree() 聚合成小队</text>
<rect x="840" y="152" width="280" height="140" rx="10" fill="#12161b" stroke="#2a303a" stroke-width="1"/>
<text x="856" y="174" fill="#c9a26a" font-size="12.5" font-weight="400" text-anchor="start">llm · 只读通道</text>
<text x="856" y="196" fill="#9aa3af" font-size="11" font-weight="400" text-anchor="start">带 sessionId？</text>
<text x="1000" y="196" fill="#4fa87a" font-size="11" font-weight="400" text-anchor="start">否 — 完全隔离</text>
<text x="856" y="214" fill="#9aa3af" font-size="11" font-weight="400" text-anchor="start">带 tools？</text>
<text x="1000" y="214" fill="#4fa87a" font-size="11" font-weight="400" text-anchor="start">否 — 不碰主 agent</text>
<text x="856" y="240" fill="#6b7480" font-size="11" font-weight="400" text-anchor="start">maxTokens: 320</text>
<text x="856" y="262" fill="#6b7480" font-size="11" font-weight="400" text-anchor="start">只在 /ask 里出现</text>
<path d="M 295 314 L 295 352" stroke="#5b8fd0" stroke-width="2" marker-end="url(#ahb)"/>
<text x="305" y="340" fill="#5b8fd0" font-size="11" font-weight="400" text-anchor="start">事件流</text>
<rect x="40" y="352" width="520" height="254" rx="10" fill="#171b21" stroke="#5b8fd0" stroke-width="1"/>
<text x="60" y="380" fill="#e6e9ee" font-size="15" font-weight="600" text-anchor="start">② lib/index.js — 宿主半</text>
<text x="60" y="402" fill="#6b7480" font-size="11.5" font-weight="400" text-anchor="start">唯一有 I/O 的一层：订阅事件、维护状态、开 HTTP 路由</text>
<rect x="60" y="416" width="480" height="40" rx="10" fill="#12161b" stroke="#2a303a" stroke-width="1"/>
<text x="76" y="441" fill="#e6e9ee" font-size="12" font-weight="400" text-anchor="start">applySessionEvent()   事件 → state</text>
<rect x="60" y="462" width="480" height="40" rx="10" fill="#12161b" stroke="#2a303a" stroke-width="1"/>
<text x="76" y="487" fill="#e6e9ee" font-size="12" font-weight="400" text-anchor="start">bucketFor(id)   sessionId → { state, children }</text>
<rect x="60" y="508" width="480" height="40" rx="10" fill="#12161b" stroke="#2a303a" stroke-width="1"/>
<text x="76" y="533" fill="#5b8fd0" font-size="12" font-weight="500" text-anchor="start">buildView(state)  →  一帧 view</text>
<rect x="60" y="554" width="480" height="40" rx="10" fill="#12161b" stroke="#2a303a" stroke-width="1"/>
<text x="76" y="579" fill="#9aa3af" font-size="12" font-weight="400" text-anchor="start">publish() · shouldPush() 节流 350ms + SSE</text>
<rect x="600" y="352" width="540" height="254" rx="10" fill="#12161b" stroke="#3f9c94" stroke-width="1"/>
<text x="620" y="380" fill="#e6e9ee" font-size="15" font-weight="600" text-anchor="start">③ lib/narrative.js — 纯语言层</text>
<text x="620" y="402" fill="#6b7480" font-size="11.5" font-weight="400" text-anchor="start">无 I/O、无 ctx、无定时器 —— 所以 127 项测试能直接跑它</text>
<text x="632" y="432" fill="#5b8fd0" font-size="11.5" font-weight="500" text-anchor="start">buildView</text>
<text x="800" y="432" fill="#6b7480" font-size="11" font-weight="400" text-anchor="start">三行 + 灯 + 位置</text>
<text x="632" y="454" fill="#c9a26a" font-size="11.5" font-weight="500" text-anchor="start">  anchorRows()</text>
<text x="800" y="454" fill="#6b7480" font-size="11" font-weight="400" text-anchor="start">给三行挂回所属请求</text>
<text x="632" y="476" fill="#3f9c94" font-size="11.5" font-weight="500" text-anchor="start">buildChronicle</text>
<text x="800" y="476" fill="#6b7480" font-size="11" font-weight="400" text-anchor="start">总览：一件事一章</text>
<text x="632" y="498" fill="#9aa3af" font-size="11.5" font-weight="500" text-anchor="start">buildTimeline</text>
<text x="800" y="498" fill="#6b7480" font-size="11" font-weight="400" text-anchor="start">战况：有序日志 ×N</text>
<text x="632" y="520" fill="#3f9c94" font-size="11.5" font-weight="500" text-anchor="start">buildTree</text>
<text x="800" y="520" fill="#6b7480" font-size="11" font-weight="400" text-anchor="start">派出去的队</text>
<text x="632" y="542" fill="#c9a26a" font-size="11.5" font-weight="500" text-anchor="start">buildReceipts</text>
<text x="800" y="542" fill="#6b7480" font-size="11" font-weight="400" text-anchor="start">提醒：发了 ≠ 读了</text>
<text x="632" y="564" fill="#9aa3af" font-size="11.5" font-weight="500" text-anchor="start">buildChecklist</text>
<text x="800" y="564" fill="#6b7480" font-size="11" font-weight="400" text-anchor="start">清单状态对位</text>
<text x="632" y="586" fill="#c9a26a" font-size="11.5" font-weight="500" text-anchor="start">buildDigest</text>
<text x="800" y="586" fill="#6b7480" font-size="11" font-weight="400" text-anchor="start">喂给「问」的摘要</text>
<rect x="40" y="640" width="520" height="150" rx="10" fill="#171b21" stroke="#2a303a" stroke-width="1"/>
